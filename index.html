{icon:'✏️',title:'鉛筆盒壞了！',text:'拉鍊突然壞掉，明天上課需要裝文具。新的鉛筆盒要 80 元。',choices:[['買一個耐用的新鉛筆盒','需要｜花費 80',s=>{if(s.cash>=80){s.cash-=80;s.mood+=5;return '你先照顧上學需要的用品，做得很好！'}return '現在現金不夠，可以看看其他選擇。'}],['先用橡皮筋固定，存錢修理','暫時省下｜心情 −2',s=>{s.mood-=2;return '你想出暫時的解決方法，也留下了修理的預算。'}],['跟家人討論怎麼修理','一起想辦法｜不花錢',s=>'遇到問題先討論，是很棒的生活理財能力！']]},
{icon:'🎲',title:'路過扭蛋機',text:'新款扭蛋看起來好有趣！轉一次要 50 元，裡面有你喜歡的小公仔。',choices:[['轉一次，享受小小樂趣','想要｜花費 50',s=>{if(s.cash>=50){s.cash-=50;s.mood+=12;return '偶爾花一點錢讓自己開心也很重要，記得量力而為！'}return '手邊現金不夠，先把錢留給更重要的事吧。'}],['拍照記下來，下次再考慮','延遲享受｜心情 −1',s=>{s.mood-=1;return '先等一等再決定，能幫助我們分辨喜歡和真正想買。'}],['把 50 元放進目標存錢','存下 50 元｜心情 −4',s=>{s.cash+=50;s.mood-=4;return '你離目標又近了一點！也記得安排一些小樂趣喔。'}]]},
{icon:'🎂',title:'朋友生日快到了',text:'好朋友邀你參加生日會。你想準備一張卡片或小禮物，預算大約 60 元。',choices:[['親手做卡片，再買小點心','心意滿滿｜花費 40',s=>{if(s.cash>=40){s.cash-=40;s.mood+=8;return '用心準備的祝福很珍貴，花費也在預算內！'}return '現金不太夠，可以改用家中材料做卡片。'}],['和同學合買一份禮物','一起分擔｜花費 30',s=>{if(s.cash>=30){s.cash-=30;s.mood+=6;return '一起分擔費用又能表達心意，這是聰明的安排！'}return '手邊現金不夠，親手做卡片也很棒。'}],['寫一封祝福信','心意不必花大錢｜不花錢',s=>{s.mood+=3;return '祝福不一定要花錢，真誠的心意一樣很棒。'}]]},
{icon:'📱',title:'免費遊戲點數廣告',text:'網路跳出「輸入帳號密碼，免費領 1,000 點！」的廣告。看起來很誘人。',choices:[['不輸入資料，告訴大人','防詐｜不花錢',s=>{s.scam=true;s.mood+=3;return '太棒了！不隨便提供個資，並找可信任的大人確認，是最安全的做法。'}],['點進去看看，但不輸入','保持警覺｜不花錢',s=>{s.mood-=1;return '有些連結會偷偷收集資料。下次先不要點，找大人一起確認更安全。'}],['輸入帳密試試看','高風險｜可能損失 100',s=>{if(!s.scam){let loss=Math.min(100,s.cash);s.cash-=loss;s.mood-=5;return `這是詐騙陷阱！你損失了 ${loss} 元。別擔心，記住不給帳密、先問大人。`}return '你已經學會保護帳號了，這次沒有上當！'}]]},
{icon:'🤝',title:'同學跟你借錢',text:'同學說忘了帶午餐錢，想跟你借 100 元，答應下週還你。你可以怎麼做？',choices:[['借 50 元，並記下借款','互相幫忙｜借出 50',s=>{if(s.cash>=50){s.cash-=50;s.loan=50;s.mood+=3;return '幫忙很溫暖，也要記清楚金額和還款時間。'}return '可以先確認自己有沒有多的錢，再決定是否幫忙。'}],['陪同學去找老師協助','安全求助｜不花錢',s=>{s.mood+=2;return '涉及金錢時找老師一起處理，能保護你和同學。'}],['把午餐錢都借出去','善意但要留意｜借出最多 100',s=>{let amt=Math.min(100,s.cash);s.cash-=amt;s.loan=amt;s.mood+=2;return `你借出了 ${amt} 元。記得保留自己的需要，也要約好還款時間。`}]]},
{icon:'🍦',title:'炎熱的放學路上',text:'天氣好熱，冰淇淋看起來很消暑，一支 35 元。你今天已經完成了功課。',choices:[['買一支冰淇淋','犒賞自己｜花費 35',s=>{if(s.cash>=35){s.cash-=35;s.mood+=10;return '完成事情後適度犒賞自己，能讓生活更有平衡！'}return '手邊現金不夠，可以回家喝水消暑。'}],['回家喝水，把錢存起來','延遲享受｜心情 −2',s=>{s.mood-=2;return '你選擇把錢留給目標。記得也可以安排小小的享受。'}],['和朋友一起分著吃','分享快樂｜花費 20',s=>{if(s.cash>=20){s.cash-=20;s.mood+=8;return '分享讓快樂加倍，也控制了花費！'}return '可以和朋友一起回家喝水聊天。'}]]},
{icon:'📚',title:'班級二手書交換',text:'同學有一本你想看的漫畫，願意用 40 元賣給你。圖書館也可能借得到。',choices:[['用 40 元買二手書','喜歡的書｜花費 40',s=>{if(s.cash>=40){s.cash-=40;s.mood+=7;return '二手書價格較實惠，閱讀也能帶來很多樂趣！'}return '你可以先問圖書館有沒有這本書。'}],['先去圖書館找找看','免費借閱｜心情 +2',s=>{s.mood+=2;return '先利用免費資源，是很棒的省錢方法！'}],['和同學約好交換閱讀','互相分享｜不花錢',s=>{s.mood+=4;return '交換閱讀讓書本發揮更多價值，也不用花錢。'}]]},

let eventTitle=state.selectedEvent.title;let lesson=lessons[(state.week-1)%lessons.length];let record={week:state.week,title:eventTitle,spent,alloc:{...alloc},interest, fundDelta,stockDelta,lesson:lesson[0],feedback:state.feedback||''};state.history.push(record);state.feedback='';if(state.week===12){state.screen='result';render();openWeekSummary(record,lesson);return}state.week++;startWeek();openWeekSummary(record,lesson);}
function openWeekSummary(r,l){const val=v=>`${v>=0?'+':''}${fmt(v)}`;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>📝 第 ${r.week} 週小結</h2><button class="close" aria-label="關閉">×</button></div><div style="font-size:13px;line-height:1.8;color:#5f7066"><b>${r.title}</b><p>${r.feedback||'謝謝你完成本週的理財選擇！'}</p></div><div class="stats" style="margin:12px 0"><div class="stat"><span>🏦 銀行利息</span><b class="small-value">+${fmt(r.interest)} 元</b></div><div class="stat"><span>🌳 基金變化</span><b class="small-value">${val(r.fundDelta)} 元</b></div><div class="stat"><span>🎈 股票變化</span><b class="small-value">${val(r.stockDelta)} 元</b></div><div class="stat"><span>🍬 本週犒賞</span><b class="small-value">${fmt(r.spent)} 元</b></div></div><div class="feedback"><b>💡 小知識：${l[0]}</b><br>${l[1]}</div><button class="primary wide" id="continueBtn">${r.week===12?'查看期末成績單':'繼續下一週'}　→</button></section></div>`;$('#modalRoot').querySelector('.close').onclick=()=>$('#modalRoot').innerHTML='';$('#continueBtn').onclick=()=>$('#modalRoot').innerHTML='';}
function renderResult(){let total=assets(),goalHit=invested()>=state.goal.amount;let badges=[];if(state.scam)badges.push(['🛡️','防詐小尖兵']);if(state.bank>=500)badges.push(['🌟','複利小達人']);if(state.fund>0&&state.stock>0)badges.push(['🧺','分散投資家']);if(state.mood>=75)badges.push(['😊','快樂理財家']);if(state.history.length===12)badges.push(['📓','週記完成者']);if(!badges.length)badges.push(['🌱','勇敢起步徽章']);root.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">12 WEEKS · COMPLETE</div><h1>${state.name}，你的週記完成了！</h1><p>每一次選擇，都是更了解自己的機會。</p></div><div class="hero-art">🏆</div></section><section class="ending"><div class="card"><div class="ending-hero"><div class="big">${goalHit?'🎉':'🌱'}</div><h2>${goalHit?'目標達成！':'冒險完成！'}</h2><p>${goalHit?`你成功為「${state.goal.name}」存下足夠的錢，太棒了！`:`你還在累積「${state.goal.name}」的路上。持續規劃，夢想會越來越近！`}</p></div><div class="report-stats"><div class="report-stat"><b>${fmt(total)} 元</b><span>期末總財產</span></div><div class="report-stat"><b>${fmt(invested())} 元</b><span>已存入各帳戶</span></div><div class="report-stat"><b>${state.mood} / 100</b><span>最後心情值</span></div></div><h3 class="card-title" style="font-size:14px">得到的徽章</h3><div class="badges">${badges.map(b=>`<span class="badge">${b[0]} ${b[1]}</span>`).join('')}</div><div class="history"><h3 class="card-title" style="font-size:14px;margin-bottom:5px">📔 我的 12 週選擇</h3>${state.history.map(h=>`<div class="history-row"><b>第 ${h.week} 週</b><span>${h.title}</span><strong>犒賞 ${fmt(h.spent)} 元</strong></div>`).join('')}</div><button class="primary wide" id="againBtn">再玩一次　↺</button></div></section>`;$('#againBtn').onclick=reset;}
function openGlossary(){let ls=[['什麼是利息？','把錢存在銀行，銀行會按照比例增加一些錢，這些增加的錢叫「利息」。利息也會再產生利息，就是複利的初步概念。'],['需要與想要有什麼不同？','「需要」是生活或學習必須的東西；「想要」能帶來快樂，但通常可以等一下或找替代方法。'],['怎麼分配預算？','先決定哪些錢要存、哪些要花，再依照計畫使用。每週檢查一次，就能慢慢調整。'],['投資會不會賠錢？','基金和股票價格會起伏，也可能虧損。分散投資能降低部分風險，但不保證獲利。'],['怎麼保護錢包和帳號？','外出帶足夠使用的現金就好；不點可疑連結、不給帳號密碼，遇到怪訊息先找大人。']];$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>📖 理財小百科</h2><button class="close" aria-label="關閉">×</button></div><div class="lesson-list">${ls.map(x=>`<article class="lesson"><b>${x[0]}</b><p>${x[1]}</p></article>`).join('')}</div></section></div>`;$('#modalRoot').querySelector('.close').onclick=()=>$('#modalRoot').innerHTML='';$('#modalRoot').querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))$('#modalRoot').innerHTML=''};}
function openTutorial(){let step=0;let steps=[['👋','嗨，準備開始！','接下來 12 週，你會遇到生活小事，練習做選擇和安排零用錢。'],['🪙','每週分配零用錢','每週領 200 元，選擇存進撲滿、銀行、基金或科技股，也能留一點錢犒賞自己。'],['🌱','慢慢存到目標','銀行每週增加 2% 利息，基金和股票會上下波動。每種選擇都有不同的風險和收穫！']];const draw=()=>{$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>開始前的小導覽</h2><button class="close" aria-label="跳過">×</button></div><div class="tutorial-step"><div class="emoji">${steps[step][0]}</div><h3>${steps[step][1]}</h3><p>${steps[step][2]}</p></div><div class="tutorial-actions"><button class="link-btn" id="skipTut">跳過教學</button><span class="muted" style="font-size:12px">${step+1} / 3</span><button class="primary" id="nextTut">${step===2?'開始冒險':'下一步 →'}</button></div></section></div>`;$('#modalRoot').querySelector('.close').onclick=done;$('#skipTut').onclick=done;$('#nextTut').onclick=()=>step<2?(step++,draw()):done()};function done(){state.tutorialDone=true;localStorage.setItem('allowanceTutorial','yes');$('#modalRoot').innerHTML='';render()}draw();}
function reset(){Object.assign(state,{screen:'setup',name:'',goal:null,week:1,cash:0,bank:0,piggy:0,fund:0,stock:0,mood:75,scam:false,loan:0,history:[],feedback:'',selectedEvent:null,allocation:{piggy:0,bank:0,fund:0,stock:0}});$('#modalRoot').innerHTML='';render()}
$('#glossaryBtn').onclick=openGlossary;$('#restartBtn').onclick=()=>{if(confirm('要重新開始一場新的 12 週冒險嗎？目前週記不會保留。'))reset()};render();
})();
</script></body></html>
